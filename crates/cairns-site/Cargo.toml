[package]
name = "cairns-site"
description = "Renders a cairns worklog into a static site, from log.json."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cairns-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Pure-Rust regex and the bundled grammars only: no C dependency, no themes -
# the colours come from the site's own stylesheet, by class.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "html", "regex-fancy", "yaml-load"] }
