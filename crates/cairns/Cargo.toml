[package]
name = "cairns"
description = "A worklog kept as numbered markdown entries: write them, check them, publish them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "cairns"
path = "src/main.rs"

[dependencies]
cairns-core = { workspace = true }
cairns-site = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
# Git, read in-process: the tracked files and a file at a revision. No `git`
# binary needed, and nothing to scrape from its output.
gix = { version = "0.89", default-features = false, features = ["revision", "index", "sha1"] }
# Reading another worklog's ids.json, for references into it. Pure Rust, TLS
# included - no curl to run, no OpenSSL to link.
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
