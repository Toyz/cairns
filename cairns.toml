spec_version = 1

[project]
name        = "cairns"
slug        = "cairns"
description = "A worklog kept as numbered markdown entries: write them, check them, publish them."
repository  = "https://github.com/Toyz/cairns"

[site]
base_url = "https://toyz.github.io/cairns/"
readme   = "README.md"

# Reference pages beside the log. Opt-in: remove this section and the site has
# no Reference tab.
[[link]]
label = "Repository"
url   = "https://github.com/Toyz/cairns"
icon  = "github"

[[link]]
label = "Releases"
url   = "https://github.com/Toyz/cairns/releases"
icon  = "download"

[docs]
dir   = "docs"
label = "Reference"

[area]
spec     = "the format itself - entries, config, log.json, publishing"
core     = "cairns-core: parsing, validation, the canonical document"
site     = "the renderer and the static site it emits"
cli      = "the cairns command and its surface"
publish  = "publish targets and the delivery payload"
skill    = "the Claude skill shipped with the tool"
adoption = "migrating an existing worklog onto cairns"
build    = "workspace layout, CI, releases"

[[publish]]
name = "site"
type = "dir"
path = "site/"
