# Binaries for a tagged release. Someone handed a link should not need a Rust
# toolchain to read a worklog.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, musl: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The tag is the version. Nothing is committed.
      - run: ./scripts/version-from-tag.sh "${{ github.ref_name }}"
        shell: bash
      - run: cargo build --release --locked -p cairns --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="cairns-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/cairns.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/cairns" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            cairns-*.tar.gz
            cairns-*.zip

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum cairns-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Opt-in: set the repository variable PUBLISH_TO_CRATES to "true" and add a
  # CARGO_REGISTRY_TOKEN secret. Without both, a tag only cuts binaries.
  crates:
    needs: binaries
    if: vars.PUBLISH_TO_CRATES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/version-from-tag.sh "${{ github.ref_name }}"
      # In dependency order, because each one has to be on the index before the
      # next can resolve it.
      - run: cargo publish -p cairns-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p cairns-site --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p cairns --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
