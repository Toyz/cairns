# Publish this repo's own worklog to GitHub Pages.
#
# `check` runs first and is allowed to fail the build: a stale index or an entry
# filed under an area that does not exist should stop a deploy, not ship.
name: worklog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Tags too, so the build can say which release it is - or how far past
      # one - in the site's footer, rather than "a development build".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: echo "CAIRNS_DESCRIBE=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - run: cargo run --quiet -p cairns -- check
      - run: cargo run --quiet -p cairns -- build --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
