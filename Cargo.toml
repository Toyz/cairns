[workspace]
resolver = "3"
members = ["crates/cairns-core", "crates/cairns-site", "crates/cairns"]

[workspace.package]
# The tag is the version. CI rewrites this from `v*` on a release, and nothing
# in the repo ever claims a release number, so there is no file to bump and no
# way for a tag and a manifest to disagree.
version = "0.0.0-dev"
edition = "2024"
# Let-chains, which config.rs uses.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Toyz/cairns"
authors = ["Toyz"]
keywords = ["worklog", "changelog", "documentation", "markdown", "static-site"]
categories = ["command-line-utilities", "development-tools"]

# Beyond clippy's defaults: the ones that catch work done for nothing - a
# string built to be appended, an argument taken by value and only read, a
# clone of something already owned - and numbers narrowed without a check.
# Each was in the code when they were turned on.
[workspace.lints.clippy]
format_push_string = "warn"
format_collect = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
single_char_pattern = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_string_new = "warn"
needless_collect = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.dependencies]
cairns-core = { path = "crates/cairns-core", version = "0.0.0-dev" }
cairns-site = { path = "crates/cairns-site", version = "0.0.0-dev" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
